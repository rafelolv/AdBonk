name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm run build:extension
      - name: Check stable version matches tag
        run: |
          VERSION=$(sed -n 's|^// @version[[:space:]]*||p' vaft/vaft.user.js)
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - name: Require release notes
        id: notes
        run: |
          NOTES_PATH="docs/releases/$GITHUB_REF_NAME.md"
          test -s "$NOTES_PATH" || { echo "Missing release notes: $NOTES_PATH" >&2; exit 1; }
          echo "path=$NOTES_PATH" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: AdBonk ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            vaft/vaft.user.js
            LICENSE
            dist/adbonk-chromium-*.zip
            dist/adbonk-firefox-*.zip

  firefox:
    needs: release
    uses: ./.github/workflows/publish-firefox.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
