name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - name: Check stable version matches tag
        run: |
          VERSION=$(sed -n 's|^// @version[[:space:]]*||p' vaft/vaft.user.js)
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            vaft/vaft.user.js
            vaft/vaft-ublock-origin.js
            LICENSE
