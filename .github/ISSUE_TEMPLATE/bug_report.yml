name: Bug Report
description: Report an issue with AdBonk
labels: ["bug"]
body:
  - type: checkboxes
    id: prechecks
    attributes:
      label: Before submitting, please check
      options:
        - label: I am using the latest version (not a permalink)
        - label: I have restarted my browser and checked that the userscript is enabled
        - label: I have checked [Known Extension Conflicts](https://github.com/rafelolv/AdBonk/blob/main/README.md#extension-conflicts) — 7TV, TTV-AB, Purple AdBlock, and TwitchNoSub are known to cause issues

  - type: dropdown
    id: script
    attributes:
      label: Which script are you using?
      options:
        - AdBonk (userscript)
        - video-swap-new (userscript)
        - strip (userscript)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Script version
      description: "Check your userscript manager for the public AdBonk version. You can also include the internal counter from the browser console (F12); it is separate from the public version."
      placeholder: "e.g. AdBonk 1.0.10; internal counter 96"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Brave
        - Edge
        - Safari
        - Other
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - Tampermonkey
        - Violentmonkey
        - ScriptCat
        - Greasemonkey (compatibility report; currently unsupported)
        - Other
    validations:
      required: true

  - type: input
    id: manager-version
    attributes:
      label: Userscript manager version
      description: Include the extension version so compatibility reports can be reproduced.
      placeholder: "e.g. Violentmonkey 2.x or ScriptCat 1.x"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the issue (black screen, buffering, ads showing, etc.)
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Open browser console (F12) and paste any [AD DEBUG] messages or errors
      render: shell
    validations:
      required: false

  - type: textarea
    id: extensions
    attributes:
      label: Other Twitch extensions installed
      description: List any other Twitch-related extensions (7TV, BTTV, FFZ, TTV-AB, Purple AdBlock, etc.)
      placeholder: "e.g. 7TV, BetterTTV, FrankerFaceZ"
    validations:
      required: true

  - type: checkboxes
    id: conflicts
    attributes:
      label: Troubleshooting
      options:
        - label: I have disabled ALL other Twitch-related extensions and the issue still occurs (including but not limited to 7TV, BTTV, FFZ, TTV-AB, Purple AdBlock, AdGuard, and any other ad blockers or Twitch enhancers)
        - label: Issue persists after clearing browser cache and restarting
        - label: Issue does NOT occur without the script installed
