<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280" role="img" aria-labelledby="title description">
  <title id="title">AdBonk — Bonk Twitch ads.</title>
  <desc id="description">A purple banner with the AdBonk wordmark and a cartoon mallet knocking an ad tile sideways.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#201334"/>
      <stop offset="1" stop-color="#38205b"/>
    </linearGradient>
    <clipPath id="banner-edge">
      <rect width="1100" height="280" rx="24"/>
    </clipPath>
  </defs>
  <rect width="1100" height="280" rx="24" fill="url(#background)"/>
  <g clip-path="url(#banner-edge)">
    <circle cx="990" cy="220" r="210" fill="#a970ff" opacity=".07"/>
